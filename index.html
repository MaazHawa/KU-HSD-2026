<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gunter's Forge</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <h1>Gunter's Forge</h1>
    <p>Hand-forged in Mautern</p>
  </header>

  <main>
    <section id="view-shop" class="view active">
      <h2>The Wares</h2>
      <div id="product-list"></div>
    </section>

    <section id="view-track" class="view">
      <h2>Where Is My Order?</h2>
      <form id="track-form">
        <input id="track-id" placeholder="Order ID (e.g. GF-1001)" autocomplete="off">
        <button type="submit">Find</button>
      </form>
      <div id="track-result"></div>
      <h3>Gunter's To-Do List</h3>
      <ol id="queue-list"></ol>
    </section>

    <section id="view-shop-admin" class="view">
      <h2>Workshop</h2>
      <h3>Supplies</h3>
      <div id="supply-list"></div>
      <h3>Orders</h3>
      <div id="admin-orders"></div>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <nav>
    <button data-view="view-shop" class="active">Shop</button>
    <button data-view="view-track">My Order</button>
    <button data-view="view-shop-admin">Workshop</button>
  </nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
